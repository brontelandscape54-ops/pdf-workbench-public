[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-workbench"
version = "0.1.0"
description = "GUI for splitting PDFs for external OCR and restoring searchable PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Rimpei Takahashi"}]
dependencies = [
  "PyMuPDF>=1.26,<2",
  "Pillow>=11,<13",
  "PySide6>=6.7,<7",
]

[project.scripts]
pdf-workbench = "pdf_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
